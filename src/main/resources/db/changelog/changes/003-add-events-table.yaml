databaseChangeLog:
  - changeSet:
      id: 003-add-events-table
      author: Antony Ochieng
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: organizer_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: date
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: location
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: ticket_quota
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: tickets_booked
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: events
            baseColumnNames: organizer_id
            constraintName: fk_events_organizer
            referencedTableName: users
            referencedColumnNames: id