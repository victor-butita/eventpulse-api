databaseChangeLog:
  - changeSet:
      id: 005-create-bookings-table
      author: antony

      changes:
        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_bookings
                    nullable: false

              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: attendee_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: booked_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: bookings
            baseColumnNames: event_id
            referencedTableName: events
            referencedColumnNames: id
            constraintName: fk_bookings_event

        - addForeignKeyConstraint:
            baseTableName: bookings
            baseColumnNames: attendee_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_bookings_attendee