version: 2.1

jobs:
  build-test-scan:
    # Machine executor provides a local Docker daemon so Testcontainers
    # (MySQLContainerTest) can start MySQL 8. The Docker executor cannot.
    machine:
      image: ubuntu-2204:current
    resource_class: medium

    steps:
      - checkout

      - run:
          name: Install OpenJDK 17
          command: |
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk
            echo 'export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64' >> "$BASH_ENV"
            echo 'export PATH=$JAVA_HOME/bin:$PATH' >> "$BASH_ENV"

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}

      - run:
          name: Build and run tests
          no_output_timeout: 20m
          command: |
            java -version
            ./mvnw clean verify

      - save_cache:
          paths:
            - ~/.m2
          key: maven-deps-{{ checksum "pom.xml" }}

      - run:
          name: SonarQube Cloud scan
          command: |
            if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_ORGANIZATION" ]; then
              echo "Missing CircleCI env vars: SONAR_TOKEN, SONAR_PROJECT_KEY, SONAR_ORGANIZATION"
              exit 1
            fi

            echo "Sonar org=${SONAR_ORGANIZATION} projectKey=${SONAR_PROJECT_KEY} token_set=yes"

            ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
              -Dsonar.organization=${SONAR_ORGANIZATION} \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.token=${SONAR_TOKEN} \
              -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

workflows:
  build-test-scan:
    jobs:
      - build-test-scan:
          context:
            - eventpulse-mail
